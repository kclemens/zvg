<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hauction — Immobilienversteigerungen auf der Karte</title>

  <!-- Leaflet 1.9.x -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet.markercluster 1.5.x -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Filter bar ────────────────────────────────────────────────────── -->
  <div id="filter-bar">

    <!-- Category checkboxes -->
    <div class="filter-group">
      <span class="filter-group-label">Kategorie:</span>
      <label class="filter-check"><input type="checkbox" name="category" value="house"      checked /> <span class="legend-dot" style="background:#e74c3c;"></span> Haus</label>
      <label class="filter-check"><input type="checkbox" name="category" value="apartment"  checked /> <span class="legend-dot" style="background:#3498db;"></span> Wohnung</label>
      <label class="filter-check"><input type="checkbox" name="category" value="land"       checked /> <span class="legend-dot" style="background:#27ae60;"></span> Grundstück</label>
      <label class="filter-check"><input type="checkbox" name="category" value="commercial" checked /> <span class="legend-dot" style="background:#f39c12;"></span> Gewerbe</label>
      <label class="filter-check"><input type="checkbox" name="category" value="garage"     checked /> <span class="legend-dot" style="background:#9b59b6;"></span> Garage</label>
      <label class="filter-check"><input type="checkbox" name="category" value="other"      checked /> <span class="legend-dot" style="background:#95a5a6;"></span> Sonstiges</label>
    </div>

    <!-- Numeric filters -->
    <div class="filter-group filter-group-numbers">
      <label class="filter-number-label">
        Max. Preis
        <input type="number" id="filter-max-price" placeholder="Max price" min="0" step="1000" />
      </label>
      <label class="filter-number-label">
        Max. Wasserabstand (km)
        <input type="number" id="filter-max-water" placeholder="Max water dist (km)" min="0" step="1" />
      </label>
      <label class="filter-number-label">
        Max. Flughafen (km)
        <input type="number" id="filter-max-airport" placeholder="Max airport dist (km)" min="0" step="1" />
      </label>
    </div>

    <!-- Result counter -->
    <div class="filter-group filter-group-count">
      <span id="filter-count">Wird geladen…</span>
    </div>

  </div>

  <!-- ── Map ───────────────────────────────────────────────────────────── -->
  <div id="map"></div>

  <!-- ── Status bar ────────────────────────────────────────────────────── -->
  <div id="status"></div>

  <script src="app.js" defer></script>
</body>
</html>
